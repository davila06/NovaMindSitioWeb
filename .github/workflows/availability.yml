name: Website Availability

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: website-availability
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check website
        id: health
        continue-on-error: true
        run: |
          set -o pipefail
          curl --fail --retry 2 --retry-delay 5 --max-time 30 https://novamindglobalcr.com/api/health | \
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).status!=="ok")process.exit(1)})'
          curl --fail --retry 2 --max-time 30 --output /dev/null https://novamindglobalcr.com/
      - name: Open incident or close on recovery
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const title = "[Availability] novamindglobalcr.com";
            const {owner, repo} = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: "open", creator: "github-actions[bot]", per_page: 100});
            const incidents = open.filter(issue => !issue.pull_request && issue.title === title);
            if (process.env.HEALTH_OUTCOME !== "success") {
              if (!incidents.length) {
                await github.rest.issues.create({owner, repo, title, body: `Availability check failed. Inspect the [workflow logs](https://github.com/${owner}/${repo}/actions/runs/${context.runId}).`});
              }
              core.setFailed("Website availability check failed.");
            } else {
              for (const incident of incidents) {
                await github.rest.issues.createComment({owner, repo, issue_number: incident.number, body: "Availability checks recovered; closing this incident."});
                await github.rest.issues.update({owner, repo, issue_number: incident.number, state: "closed"});
              }
            }
