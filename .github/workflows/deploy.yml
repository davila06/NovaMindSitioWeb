name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: "107c02d258c4e14855594fdfbdc7d903"
      DEPLOY_MODE: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run content:index
      - run: npm run types:cloudflare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm audit
      - run: npm run content:index && npx cf build --mode "$DEPLOY_MODE"
      - name: Deploy validated build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$TURNSTILE_SECRET_KEY" || { echo "Missing TURNSTILE_SECRET_KEY"; exit 1; }
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({TURNSTILE_SECRET_KEY:process.env.TURNSTILE_SECRET_KEY}))' "$secrets_file"
          npx cf deploy --prebuilt --mode "$DEPLOY_MODE" --secrets-file "$secrets_file"
      - name: Verify deployment
        run: |
          if [ "$DEPLOY_MODE" = "production" ]; then
            url="https://novamindglobalcr.com"
          else
            url="https://staging.novamindglobalcr.com"
          fi
          curl --fail --retry 5 --retry-delay 5 --max-time 30 "$url/api/health" | \
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{if(JSON.parse(s).status!=="ok")process.exit(1)})'
